<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>OnayRandevu</title>
  <!--
    Sekme ikonu, components/logo-mark.tsx ile aynı işaret: "O"yu temsil eden
    yeşil çember + kalın onay tiki. Logonun kendi sunumuna sadık kalmak için koyu
    rozet içinde; tema duyarlı favicon her tarayıcıda çalışmadığından renkler
    sabit (koyu zemin, parlak yeşil işaret). İşaret rozet içine ortalanıp küçültüldü.
  -->
  <rect width="100" height="100" rx="23" fill="#1D1918" />
  <g transform="translate(50 50) scale(0.82) translate(-48 -51)" fill="none" stroke="#3FCB96">
    <path d="M 70.2 72.4 A 32 32 0 1 1 53.0 22.7" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 26 49 L 41 65 L 84 17" stroke-width="14" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="10" />
  </g>
</svg>
